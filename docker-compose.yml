services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - pathforge-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/pathforge
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4000}
      APP_URL: ${APP_URL:-http://localhost:4000}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "1"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@pathforge.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin_PathForge_123!}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@pathforge.dev}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo_PathForge_123!}
      CLIENT_DIST: /app/client/dist

volumes:
  pathforge-mongo:
