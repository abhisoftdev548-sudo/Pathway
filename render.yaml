services:
  - type: web
    name: quizsphere-api
    env: node
    buildCommand: npm install && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: MONGODB_URI, sync: false }
      - { key: JWT_SECRET, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: SEED_ON_BOOT, value: "true" }
